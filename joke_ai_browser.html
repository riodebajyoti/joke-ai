<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joke AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101127;color:#f7f4ff;font:18px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(780px,100%)}header{display:flex;align-items:center;gap:18px;margin-bottom:25px}.icon{font-size:44px;background:#302451;padding:12px;border-radius:24px}h1{margin:0;font-size:42px}header p{margin:5px 0;color:#bdb4d5}.card{background:#1d1c38;border:1px solid #44405f;border-radius:28px;padding:28px;box-shadow:0 20px 70px #0004}.tag{color:#d8b5ff;font-size:13px;letter-spacing:2px;font-weight:700}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:13px 20px;background:#bca0ff;color:#171126;font-weight:650}button:hover{filter:brightness(1.1)}button.secondary{background:#383451;color:#fff}button:disabled{opacity:.45;cursor:default}#chat{min-height:230px;max-height:400px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:10px 0}.bubble{padding:14px 18px;border-radius:18px;background:#302d4c;max-width:90%;white-space:pre-wrap}.bubble.user{background:#584584;align-self:flex-end}.bubble.system{background:transparent;color:#c5badb;font-size:15px}form{display:flex;gap:10px;margin-top:16px}input{min-width:0;flex:1;border:1px solid #68607e;border-radius:13px;background:#121126;color:white;font:inherit;padding:14px}input:focus{outline:2px solid #bca0ff}footer{color:#a49bb8;text-align:center;font-size:14px;margin:20px}#welcome{margin-top:0}.small{font-size:14px;padding:8px 12px} @media(max-width:500px){.card{padding:18px}h1{font-size:32px}form{flex-wrap:wrap}form button{flex:1}}
</style>
<div class="app"><header><div class="icon">😄</div><div><h1>Joke AI</h1><p>A little laugh, whenever you like.</p></div></header><main class="card"><div class="tag">DATTA • JOKE CLUB</div><h2 id="welcome"></h2><p>Pick a joke. Take a guess. Keep the laughs going.</p><div class="choices"><button id="knock">Knock knock</button><button id="regular" class="secondary">Regular joke</button><button id="quit" class="secondary">Quit</button></div><div id="chat" aria-live="polite" role="log"></div><form id="form"><input id="reply" aria-label="Your answer" autocomplete="off" placeholder="Choose a joke above" disabled><button id="send" disabled>Send</button></form></main><footer>Made by Rio · Runs locally · Random jokes from a saved collection<br><button id="rename" class="secondary small">Change name</button></footer></div>
<script>
const initialName="Rio";
const chat=document.querySelector('#chat'),reply=document.querySelector('#reply'),send=document.querySelector('#send');
let name;try{name=localStorage.getItem('joke-ai-name')||initialName}catch{name=initialName}
let state='idle',current=null,lastKnock=-1,lastRegular=-1;
const knockJokes=[['Lettuce',"Lettuce in, it’s cold!"],['Boo',"Boo hoo, don’t cry, it’s just a joke!"],['Tank',"You’re welcome!"],['Olive','Olive you!'],['Canoe','Canoe help me open this door?']];
const regularJokes=[['Why did the bike fall over?','It was two-tired',['it was two tired','because it was two tired','two tired','too tired']],['What do you call a sleeping dinosaur?','A dino-snore',['a dino snore','dino snore']],['Why did the math book look sad?','It had too many problems',['it had too many problems','too many problems','because it had too many problems']],['What do you call a bear with no teeth?','A gummy bear',['a gummy bear','gummy bear']],['Why did the student eat their homework?','The teacher said it was a piece of cake',['the teacher said it was a piece of cake','because it was a piece of cake','it was a piece of cake']]];
function title(){document.querySelector('#welcome').textContent='Welcome back, '+name+'!'}title();
function say(text,type=''){const el=document.createElement('div');el.className='bubble '+type;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight}
function input(on,placeholder='Your answer…'){reply.disabled=!on;send.disabled=!on;reply.placeholder=placeholder;reply.value='';if(on)reply.focus()}
function pick(list,last){let ids=list.map((_,i)=>i).filter(i=>i!==last);return ids[Math.floor(Math.random()*ids.length)]}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}
function ready(){state='idle';input(false,'Choose another joke above');say('Choose another joke whenever you’re ready.','system')}
document.querySelector('#knock').onclick=()=>{lastKnock=pick(knockJokes,lastKnock);current=knockJokes[lastKnock];state='who';say('Knock knock!');input(true,"Say: Who’s there?")};
document.querySelector('#regular').onclick=()=>{lastRegular=pick(regularJokes,lastRegular);current=regularJokes[lastRegular];state='guess';say(current[0]);input(true,'Guess, or type why / what to reveal')};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const value=reply.value.trim();if(!value)return;say(value,'user');reply.value='';if(state==='who'){say(current[0]);state='punchline';input(true,'Say: '+current[0]+' who?')}else if(state==='punchline'){say(current[1]);ready()}else if(state==='guess'){const valueNorm=norm(value);if(!['why','what'].includes(valueNorm)){const correct=[current[1],...current[2]].some(a=>norm(a)===valueNorm);say(correct?'Right! 🎉':'Not quite!')}say('The answer is: '+current[1]+'!');ready()}};
document.querySelector('#quit').onclick=()=>{state='idle';input(false,'Choose a joke to play again');say('See you later, '+name+'! Your name stays saved.');};
document.querySelector('#rename').onclick=()=>{const next=prompt('What name should Joke AI remember?',name);if(next&&next.trim()){name=next.trim();try{localStorage.setItem('joke-ai-name',name)}catch{}title();say('I’ll call you '+name+'.','system')}};
say('Ready for a laugh? Pick knock knock or a regular joke.');
</script></html>
